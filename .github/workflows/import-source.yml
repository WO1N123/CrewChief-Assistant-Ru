name: Import source
on:
  push:
    paths:
      - '.source-upload/seg*.b64'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and import source
        shell: bash
        run: |
          set -euo pipefail
          cat .source-upload/seg*.b64 | base64 -d > /tmp/source.zip
          unzip -t /tmp/source.zip
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          rm -rf .source-upload
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/source/. ./
          rm -f .github/workflows/import-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import CrewChief RU 0.9.4 source"
          git push
